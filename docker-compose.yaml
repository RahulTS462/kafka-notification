version: '3.8'

services:
  kafka:
    image: confluentinc/cp-kafka:7.8.3
    container_name: kafka
    ports:
      - "9092:9092"

    environment:
      KAFKA_KRAFT_MODE: 'true'

      CLUSTER_ID: '1g86f-h8h7-nvjc'
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker, controller #can act as both broker(store and serve date) and controller(manage cluster coordination)

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093  #which controller can vote on cluster decisions

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1 # NO BACKUP - ONE COPY, DEFAULT = 3 FOR A CLUSTER OF 3 NODES

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092, CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

    volumes:
      - kafka_kraft:/var/lib/kafka/data

volumes:
  kafka_kraft:
